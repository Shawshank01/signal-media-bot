name: Build and Push Docker Image

on:
  push:
    branches:
    - main
    paths:
    - "bot.py"
    - "requirements.txt"
    - "Dockerfile"
    - ".dockerignore"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check-media-updates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up ARM64 emulation
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compare FFmpeg and yt-dlp versions
      id: check
      env:
        PUBLISHED_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot:latest
      run: python3 .github/scripts/check-media-updates.py

  build:
    needs: check-media-updates
    if: >-
      ${{ !cancelled() && (github.event_name != 'schedule' ||
          (needs.check-media-updates.result == 'success' &&
           needs.check-media-updates.outputs.rebuild == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux/amd64
        - os: ubuntu-24.04-arm
          platform: linux/arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        pull: true
        no-cache: ${{ github.event_name == 'schedule' }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot,push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot
        tags: |
          type=raw,value=latest
          type=sha,format=short

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(echo '${{ steps.meta.outputs.json }}' | jq -cr '.tags | map("-t " + .) | join(" ")') \
          $(printf '${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/signal-media-bot:latest
