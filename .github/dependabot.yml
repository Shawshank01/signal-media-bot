version: 2
updates:
# Maintain Python dependencies in requirements.txt
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  groups:
    dependencies:
      patterns:
      - "*"

# Maintain GitHub Actions workflows
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
